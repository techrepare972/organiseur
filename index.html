<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Precision - Organiseur Professionnel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- Image Compression -->
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.1/dist/browser-image-compression.js"></script>
    <!-- Signature Pad -->
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            --brand-teal: #0d9488;
            --brand-purple: #7c3aed;
        }

        body { 
            background-color: #f8fafc; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }

        .form-input { 
            @apply w-full px-4 py-3 bg-white border border-slate-200 rounded-2xl shadow-sm focus:outline-none focus:ring-4 focus:ring-teal-500/10 focus:border-teal-500 transition-all duration-300 text-slate-700; 
        }

        .btn { 
            @apply px-5 py-3 rounded-2xl shadow-sm font-bold transition-all duration-300 flex items-center justify-center gap-2 active:scale-95 disabled:opacity-50; 
        }

        .btn-primary { @apply bg-teal-600 text-white hover:bg-teal-700 shadow-lg shadow-teal-600/20; }
        .btn-secondary { @apply bg-white border border-slate-200 text-slate-600 hover:bg-slate-50; }
        .btn-danger { @apply bg-rose-50 text-rose-600 hover:bg-rose-100 border border-rose-100; }
        .btn-whatsapp { @apply bg-emerald-50 text-emerald-600 hover:bg-emerald-100 border border-emerald-100; }
        .btn-sign { @apply bg-amber-50 text-amber-600 hover:bg-amber-100 border border-amber-100; }

        .card { 
            @apply bg-white rounded-[2.5rem] shadow-sm border border-slate-100 overflow-hidden transition-all duration-500 hover:shadow-xl hover:shadow-slate-200/60 hover:-translate-y-1; 
        }

        .filter-btn { 
            @apply px-6 py-2.5 text-sm font-bold text-slate-400 bg-transparent rounded-2xl transition-all hover:text-slate-600; 
        }
        .filter-btn.active { 
            @apply bg-white text-teal-600 shadow-lg shadow-slate-200/50; 
        }

        #edit-modal, #signature-modal { 
            display: none; 
            backdrop-filter: blur(8px);
        }

        .photo-preview-container { 
            @apply relative w-32 h-32 bg-slate-50 rounded-[2rem] flex items-center justify-center text-slate-300 overflow-hidden border-2 border-dashed border-slate-200 shadow-inner; 
        }

        canvas#signature-pad { 
            cursor: crosshair; 
            touch-action: none; 
            background: #fff; 
            width: 100%; 
            height: 250px; 
        }

        .status-badge { 
            @apply text-[10px] font-black uppercase tracking-widest px-3 py-1.5 rounded-xl border; 
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="text-slate-800 pb-20">

    <div class="container mx-auto p-4 md:p-10 max-w-6xl">

        <!-- HEADER -->
        <header class="text-center mb-16 relative">
            <div class="inline-flex items-center gap-3 bg-slate-900 text-white py-3 px-8 rounded-[2rem] mb-8 shadow-2xl shadow-slate-900/20">
                <span class="text-2xl">🔬</span>
                <h1 class="text-lg font-black tracking-tighter uppercase">Tech Precision PRO</h1>
            </div>
            <h2 class="text-5xl md:text-6xl font-extrabold text-slate-900 tracking-tighter mb-4">
                Organiseur <span class="text-teal-600 italic">Cloud</span>
            </h2>
            <p class="text-slate-400 text-lg font-medium max-w-md mx-auto leading-relaxed">
                Interventions, Rapports & Microsoudure synchronisés partout.
            </p>
        </header>

        <!-- DASHBOARD -->
        <section id="dashboard" class="grid grid-cols-2 md:grid-cols-4 gap-6 mb-16">
            <div class="stat-card bg-white p-6 rounded-[2.5rem] border border-slate-100 shadow-sm text-center">
                <p class="text-[11px] font-black text-slate-400 uppercase tracking-widest mb-2">Rapports</p>
                <p class="text-4xl font-black text-teal-600" id="stat-reports">0</p>
            </div>
            <div class="stat-card bg-white p-6 rounded-[2.5rem] border border-slate-100 shadow-sm text-center">
                <p class="text-[11px] font-black text-slate-400 uppercase tracking-widest mb-2">À Faire</p>
                <p class="text-4xl font-black text-purple-600" id="stat-tasks">0</p>
            </div>
            <div class="stat-card bg-white p-6 rounded-[2.5rem] border border-slate-100 shadow-sm text-center">
                <p class="text-[11px] font-black text-slate-400 uppercase tracking-widest mb-2">Total</p>
                <p class="text-4xl font-black text-slate-800" id="stat-total">0</p>
            </div>
            <div class="stat-card bg-white p-6 rounded-[2.5rem] border border-slate-100 shadow-sm text-center">
                <p class="text-[11px] font-black text-slate-400 uppercase tracking-widest mb-2">GitHub</p>
                <p class="text-4xl font-black text-blue-500">Live</p>
            </div>
        </section>

        <!-- FORMULAIRE -->
        <section id="form-container" class="mb-20 p-8 md:p-12 bg-white rounded-[3.5rem] shadow-2xl shadow-slate-200 border border-slate-50 relative overflow-hidden">
            <div class="absolute -top-10 -right-10 w-40 h-40 bg-teal-50 rounded-full blur-3xl opacity-50"></div>
            
            <form id="main-form" class="space-y-10 relative">
                <div class="flex flex-col md:flex-row gap-6">
                    <label class="flex-1 cursor-pointer group">
                        <input type="radio" name="entryType" value="report" class="peer hidden" checked>
                        <div class="peer-checked:bg-teal-600 peer-checked:text-white border-2 border-slate-100 p-6 rounded-[2rem] text-center font-black transition-all group-hover:border-teal-200 uppercase tracking-widest text-xs">Rapport Technique</div>
                    </label>
                    <label class="flex-1 cursor-pointer group">
                        <input type="radio" name="entryType" value="task" class="peer hidden">
                        <div class="peer-checked:bg-purple-600 peer-checked:text-white border-2 border-slate-100 p-6 rounded-[2rem] text-center font-black transition-all group-hover:border-purple-200 uppercase tracking-widest text-xs">Tâche à effectuer</div>
                    </label>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="md:col-span-2">
                        <label class="block mb-2 text-xs font-black uppercase text-slate-400 tracking-widest ml-1">Client / Projet</label>
                        <input type="text" id="name" class="form-input" placeholder="Ex: Boutique GSM / Client Martin" required>
                    </div>
                    
                    <div id="field-device-container" class="md:col-span-2" style="display:none;">
                        <label class="block mb-2 text-xs font-black uppercase text-slate-400 tracking-widest ml-1">Appareil</label>
                        <input type="text" id="device" class="form-input" placeholder="Ex: iPad Air 5 (M1)">
                    </div>

                    <div>
                        <label class="block mb-2 text-xs font-black uppercase text-slate-400 tracking-widest ml-1" id="label-item">Symptôme / Objet</label>
                        <input type="text" id="item" class="form-input" placeholder="Quel est le problème ?" required>
                    </div>
                    
                    <div>
                        <label class="block mb-2 text-xs font-black uppercase text-slate-400 tracking-widest ml-1">Date</label>
                        <input type="date" id="deadline" class="form-input" required>
                    </div>

                    <div class="md:col-span-2">
                        <label class="block mb-2 text-xs font-black uppercase text-slate-400 tracking-widest ml-1">Notes & Diagnostic</label>
                        <textarea id="comments" class="form-input" rows="4" placeholder="Détails techniques, composants changés..."></textarea>
                    </div>

                    <div id="field-photo-container" class="md:col-span-2 flex items-center gap-10 p-8 bg-slate-50/50 rounded-[2.5rem] border border-slate-100 shadow-inner">
                        <div class="space-y-4">
                            <label class="block text-sm font-black text-slate-700">Preuve Visuelle</label>
                            <input type="file" id="photo-input" class="hidden" accept="image/*">
                            <button type="button" id="btn-trigger-photo" class="btn btn-secondary bg-white hover:border-teal-500 hover:text-teal-600">
                                📸 Capturer Photo
                            </button>
                        </div>
                        <div class="photo-preview-container shadow-2xl shadow-slate-200" id="preview-box">
                            <img id="img-preview" src="" class="hidden w-full h-full object-cover">
                            <span id="text-preview" class="text-[10px] font-black uppercase text-slate-300">Aucun</span>
                            <button type="button" id="btn-remove-photo" class="absolute top-2 right-2 bg-rose-500 text-white rounded-full w-6 h-6 hidden">&times;</button>
                        </div>
                    </div>

                    <div class="md:col-span-2 pt-4">
                        <button type="submit" id="btn-submit" class="btn btn-primary w-full text-xl py-6 rounded-[2rem]">
                            Enregistrer l'intervention
                        </button>
                    </div>
                </div>
            </form>
        </section>

        <!-- FILTRES ET FLUX -->
        <section id="list-container">
            <div class="flex flex-col md:flex-row justify-between items-center mb-12 gap-8 border-b border-slate-200 pb-10">
                <div class="text-center md:text-left">
                    <h3 class="text-4xl font-black text-slate-900 tracking-tighter">Flux d'Activité</h3>
                    <p class="text-slate-400 font-medium italic">Synchronisé en temps réel</p>
                </div>
                <div class="flex items-center gap-3 bg-slate-200/50 p-2 rounded-[2rem] border border-slate-200">
                    <button class="filter-btn active" data-filter="all">Tout</button>
                    <button class="filter-btn" data-filter="report">Rapports</button>
                    <button class="filter-btn" data-filter="task">Tâches</button>
                    <button id="btn-global-pdf" class="btn btn-primary text-xs px-6 py-2.5 ml-2">PDF Global</button>
                </div>
            </div>

            <div id="main-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10"></div>
            
            <div id="loading" class="text-center py-40">
                <div class="inline-block animate-spin rounded-full h-16 w-16 border-[6px] border-teal-500 border-t-transparent shadow-xl"></div>
                <p class="mt-8 text-slate-400 font-black tracking-widest uppercase text-sm">Connexion Cloud...</p>
            </div>
            
            <div id="empty-state" class="hidden text-center py-40 bg-white rounded-[4rem] border-4 border-dashed border-slate-100">
                <p class="text-slate-200 text-4xl font-black italic">Aucune donnée</p>
            </div>
        </section>
    </div>

    <!-- MODAL ÉDITION -->
    <div id="edit-modal" class="fixed inset-0 bg-slate-900/80 z-50 flex items-center justify-center p-6">
        <div class="bg-white p-10 rounded-[3.5rem] shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto border border-white/20">
            <h2 class="text-4xl font-black mb-10 text-slate-900 tracking-tighter">Mise à jour</h2>
            <form id="edit-form" class="space-y-8">
                <input type="hidden" id="edit-id">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="md:col-span-2"><label class="text-xs font-black uppercase text-slate-400 ml-1 block mb-2">Client</label><input type="text" id="edit-name" class="form-input" required></div>
                    <div class="md:col-span-2"><label class="text-xs font-black uppercase text-slate-400 ml-1 block mb-2">Appareil</label><input type="text" id="edit-device" class="form-input"></div>
                    <div class="md:col-span-2"><label class="text-xs font-black uppercase text-slate-400 ml-1 block mb-2">Objet</label><input type="text" id="edit-item" class="form-input" required></div>
                    <div><label class="text-xs font-black uppercase text-slate-400 ml-1 block mb-2">Date</label><input type="date" id="edit-deadline" class="form-input" required></div>
                    <div class="md:col-span-2"><label class="text-xs font-black uppercase text-slate-400 ml-1 block mb-2">Observations</label><textarea id="edit-comments" class="form-input" rows="5"></textarea></div>
                    <div class="md:col-span-2 flex justify-end gap-6 pt-8 border-t border-slate-100">
                        <button type="button" id="btn-cancel-edit" class="btn btn-secondary px-10">Annuler</button>
                        <button type="submit" id="btn-save-edit" class="btn btn-primary px-12 shadow-xl">Sauvegarder</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL SIGNATURE -->
    <div id="signature-modal" class="fixed inset-0 bg-slate-900/90 z-50 flex items-center justify-center p-6">
        <div class="bg-white p-12 rounded-[4rem] shadow-2xl w-full max-w-md text-center border border-white/20">
            <h2 class="text-3xl font-black text-slate-900 mb-2 tracking-tighter">Bon d'Accord</h2>
            <p class="text-slate-400 mb-10 font-medium">Signature manuelle du client</p>
            <div class="bg-slate-50 border-2 border-slate-100 rounded-[2.5rem] overflow-hidden mb-12 shadow-inner ring-12 ring-slate-50/50">
                <canvas id="signature-pad"></canvas>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <button type="button" id="btn-clear-signature" class="btn btn-secondary rounded-[1.5rem]">Effacer</button>
                <button type="button" id="btn-save-signature" class="btn btn-primary rounded-[1.5rem]">Valider</button>
            </div>
            <button id="btn-close-signature" class="mt-8 text-slate-300 hover:text-slate-500 font-bold text-sm uppercase tracking-widest">Fermer</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, query, onSnapshot } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        // --- Firebase Config (Maintained from User) ---
        const firebaseConfig = {
            apiKey: "AIzaSyDWB-2PCqA-lNNgPcBIGwcg2FzOjdgUCtM",
            authDomain: "organiseur.firebaseapp.com",
            projectId: "organiseur",
            storageBucket: "organiseur.firebasestorage.app",
            messagingSenderId: "1071813822553",
            appId: "1:1071813822553:web:884c5bf87a81b928494948"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // Internal platform rule: Use strict paths
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'tech-precision-pro-v3';
        const entriesPath = ['artifacts', appId, 'public', 'data', 'entries'];

        const signaturePad = new SignaturePad(document.getElementById('signature-pad'));
        const LOGO_B64 = 'data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAYABgAAD/2wBDAAMCAgMCAgMDAwMEAwMEBQgFBQQEBQoHBwYIDAoMDAsKCwsNDhIQDQ4RDgsLEBYQERMUFRUVDA8XGBYUGBIUFRT/2wBDAQMEBAUEBQkFBQkUDQsNFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBT/wAARCAA4AKADASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1VZXWFlaY2RlZmdoaWpzdHV2d3h5eoKDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1VZXWFlaY2RlZmdoaWpzdHV2d3h5eoKDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uLj5OXm5+jp6vLz9PX2t/j5+v/aAAwDAQACEQMRAD8A/fyiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooA//Z';

        // Selectors
        const mainGrid = document.getElementById('main-grid');
        const mainForm = document.getElementById('main-form');
        const emptyState = document.getElementById('empty-state');
        const loading = document.getElementById('loading');
        const editModal = document.getElementById('edit-modal');
        const signatureModal = document.getElementById('signature-modal');

        let currentData = [];
        let currentFilter = 'all';
        let tempPhotoBase64 = null;
        let activeRecordId = null;
        let user = null;

        // --- AUTH ---
        const initAuth = async () => {
            try {
                // Rule 3: Auth first
                await signInAnonymously(auth);
            } catch (err) {
                console.error("Auth error:", err);
            }
        };
        initAuth();

        onAuthStateChanged(auth, (u) => {
            user = u;
            if (user) startSync();
        });

        // --- SYNC ---
        function startSync() {
            if (!user) return;
            // Rule 1: Use specific path
            const entriesCol = collection(db, ...entriesPath);
            onSnapshot(query(entriesCol), (snap) => {
                currentData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                // Sort in memory as per Rule 2
                currentData.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
                refreshUI();
                loading.style.display = 'none';
            }, (err) => {
                console.error("Firestore sync error:", err);
                if (err.message.includes('permissions')) {
                    alert("ERREUR PERMISSIONS : Vous devez configurer les règles Firestore dans votre console Firebase.");
                }
            });
        }

        function refreshUI() {
            document.getElementById('stat-reports').textContent = currentData.filter(d => (d.type || 'report') === 'report').length;
            document.getElementById('stat-tasks').textContent = currentData.filter(d => d.type === 'task').length;
            document.getElementById('stat-total').textContent = currentData.length;

            const filtered = currentData.filter(d => currentFilter === 'all' || (d.type || 'report') === currentFilter);
            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                mainGrid.innerHTML = '';
                return;
            }

            emptyState.classList.add('hidden');
            mainGrid.innerHTML = filtered.map(d => {
                const isReport = (d.type || 'report') === 'report';
                const color = isReport ? 'teal' : 'purple';
                const date = d.deadline ? new Date(d.deadline).toLocaleDateString('fr-FR') : 'Non défini';
                
                return `
                <div class="card border-t-[10px] border-${color}-600" data-id="${d.id}">
                    ${isReport && d.photo ? `<img src="${d.photo}" class="w-full h-56 object-cover bg-slate-50 border-b">` : ''}
                    <div class="p-8">
                        <div class="flex justify-between items-center mb-6">
                            <span class="status-badge bg-${color}-50 text-${color}-700 border-${color}-100">${isReport ? 'Rapport' : 'Tâche'}</span>
                            <span class="text-slate-400 text-xs font-black">${date}</span>
                        </div>
                        <h4 class="text-2xl font-bold text-slate-900 leading-tight mb-2">${d.item}</h4>
                        <p class="text-slate-500 font-bold mb-6">${d.name} ${d.device ? `• <span class="text-slate-300">${d.device}</span>` : ''}</p>
                        <div class="bg-slate-50 p-5 rounded-[1.5rem] italic text-slate-600 text-xs border border-slate-100">
                            ${d.comments || 'Aucune observation.'}
                        </div>
                        ${d.signature ? `<div class="mt-6 pt-6 border-t border-slate-50"><p class="text-[10px] font-bold text-slate-300 uppercase mb-2">Accord Client :</p><img src="${d.signature}" class="h-16 opacity-80"></div>` : ''}
                    </div>
                    <div class="px-8 py-6 bg-slate-50 border-t border-slate-100 grid grid-cols-2 gap-4">
                        <button class="btn btn-secondary text-xs edit-btn">🔧 Éditer</button>
                        <button class="btn btn-danger text-xs delete-btn">🗑️ Effacer</button>
                        ${isReport ? `<button class="btn btn-sign text-xs sign-btn col-span-2">🖋️ Signature</button>` : ''}
                        <a href="https://wa.me/?text=${encodeURIComponent('TECH PRECISION : ' + d.item + ' pour ' + d.name)}" target="_blank" class="btn btn-whatsapp text-xs col-span-2">WhatsApp</a>
                    </div>
                </div>`;
            }).join('');
        }

        // --- INTERACTIONS ---
        async function compressAndEncode(file) {
            const options = { maxSizeMB: 0.15, maxWidthOrHeight: 900, useWebWorker: true };
            const compressed = await imageCompression(file, options);
            return new Promise(res => {
                const r = new FileReader();
                r.onloadend = () => res(r.result);
                r.readAsDataURL(compressed);
            });
        }

        document.querySelectorAll('input[name="entryType"]').forEach(r => r.addEventListener('change', (e) => {
            const isReport = e.target.value === 'report';
            document.getElementById('field-device-container').style.display = isReport ? 'none' : 'block';
            document.getElementById('label-item').textContent = isReport ? 'Symptôme / Objet' : 'Tâche à effectuer';
            document.getElementById('field-photo-container').style.display = isReport ? 'flex' : 'none';
        }));

        document.getElementById('btn-trigger-photo').addEventListener('click', () => document.getElementById('photo-input').click());
        document.getElementById('photo-input').addEventListener('change', async (e) => {
            if (e.target.files[0]) {
                tempPhotoBase64 = await compressAndEncode(e.target.files[0]);
                const pre = document.getElementById('img-preview');
                pre.src = tempPhotoBase64;
                pre.classList.remove('hidden');
                document.getElementById('text-preview').classList.add('hidden');
                document.getElementById('btn-remove-photo').classList.remove('hidden');
            }
        });

        document.getElementById('btn-remove-photo').addEventListener('click', () => {
            tempPhotoBase64 = null;
            document.getElementById('img-preview').classList.add('hidden');
            document.getElementById('text-preview').classList.remove('hidden');
            document.getElementById('btn-remove-photo').classList.add('hidden');
        });

        mainForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!user) return;
            const btn = document.getElementById('btn-submit');
            btn.disabled = true; btn.innerHTML = '⚙️ Synchronisation...';

            const payload = {
                type: document.querySelector('input[name="entryType"]:checked').value,
                name: document.getElementById('name').value,
                device: document.getElementById('device').value,
                item: document.getElementById('item').value,
                deadline: document.getElementById('deadline').value,
                comments: document.getElementById('comments').value,
                photo: tempPhotoBase64,
                created_at: new Date().toISOString()
            };

            try {
                const entriesCol = collection(db, ...entriesPath);
                await addDoc(entriesCol, payload);
                mainForm.reset();
                document.getElementById('btn-remove-photo').click();
            } catch (err) { alert(err.message); }
            finally { btn.disabled = false; btn.textContent = "Enregistrer l'intervention"; }
        });

        mainGrid.addEventListener('click', async (e) => {
            const card = e.target.closest('.card'); if (!card) return;
            const id = card.dataset.id;
            const data = currentData.find(d => d.id === id);

            if (e.target.closest('.delete-btn')) {
                if (confirm("Supprimer cet enregistrement ?")) {
                    try {
                        const docRef = doc(db, ...entriesPath, id);
                        await deleteDoc(docRef);
                    } catch (err) { alert(err.message); }
                }
            }

            if (e.target.closest('.edit-btn')) {
                activeRecordId = id;
                document.getElementById('edit-id').value = id;
                document.getElementById('edit-name').value = data.name || '';
                document.getElementById('edit-device').value = data.device || '';
                document.getElementById('edit-item').value = data.item || '';
                document.getElementById('edit-deadline').value = data.deadline || '';
                document.getElementById('edit-comments').value = data.comments || '';
                editModal.style.display = 'flex';
            }

            if (e.target.closest('.sign-btn')) {
                activeRecordId = id;
                signatureModal.style.display = 'flex';
                setTimeout(() => {
                    const canvas = document.getElementById('signature-pad');
                    const ratio = Math.max(window.devicePixelRatio || 1, 1);
                    canvas.width = canvas.offsetWidth * ratio;
                    canvas.height = canvas.offsetHeight * ratio;
                    canvas.getContext("2d").scale(ratio, ratio);
                    signaturePad.clear();
                }, 200);
            }
        });

        document.getElementById('edit-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            try {
                const docRef = doc(db, ...entriesPath, id);
                await updateDoc(docRef, {
                    name: document.getElementById('edit-name').value,
                    device: document.getElementById('edit-device').value,
                    item: document.getElementById('edit-item').value,
                    deadline: document.getElementById('edit-deadline').value,
                    comments: document.getElementById('edit-comments').value
                });
                editModal.style.display = 'none';
            } catch (err) { alert(err.message); }
        });

        document.getElementById('btn-save-signature').addEventListener('click', async () => {
            if (signaturePad.isEmpty()) return;
            const btn = document.getElementById('btn-save-signature');
            btn.disabled = true;
            try {
                const b64 = signaturePad.toDataURL();
                const docRef = doc(db, ...entriesPath, activeRecordId);
                await updateDoc(docRef, { signature: b64 });
                signatureModal.style.display = 'none';
            } catch (err) { alert(err.message); } finally { btn.disabled = false; }
        });

        document.getElementById('btn-cancel-edit').addEventListener('click', () => editModal.style.display = 'none');
        document.getElementById('btn-close-signature').addEventListener('click', () => signatureModal.style.display = 'none');
        document.getElementById('btn-clear-signature').addEventListener('click', () => signaturePad.clear());

        document.querySelectorAll('.filter-btn').forEach(btn => btn.addEventListener('click', (e) => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            currentFilter = e.target.dataset.filter;
            refreshUI();
        }));

        // --- PDF Generation ---
        const getB64 = url => new Promise((res) => {
            const img = new Image(); img.crossOrigin = 'Anonymous';
            img.onload = () => {
                const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
                c.getContext('2d').drawImage(img, 0, 0); res(c.toDataURL('image/jpeg'));
            };
            img.onerror = () => res(null); img.src = url;
        });

        document.getElementById('btn-global-pdf').addEventListener('click', async () => {
            const reports = currentData.filter(d => (d.type || 'report') === 'report');
            if (reports.length === 0) return alert("Aucun rapport.");
            const btn = document.getElementById('btn-global-pdf');
            btn.textContent = '...';
            const docPdf = new jsPDF();

            for (let i = 0; i < reports.length; i++) {
                if (i > 0) docPdf.addPage();
                const d = reports[i];
                docPdf.addImage(LOGO_B64, 'JPEG', 15, 10, 45, 12);
                docPdf.setFillColor(34, 147, 146).rect(0, 28, 210, 12, 'F');
                docPdf.setFontSize(14).setTextColor(255).setFont('helvetica', 'bold').text("RAPPORT D'INTERVENTION", 105, 36, { align: 'center' });
                docPdf.setFontSize(10).setTextColor(100).setFont('helvetica', 'normal').text(`Date : ${new Date(d.deadline).toLocaleDateString('fr-FR')}`, 195, 18, { align: 'right' });
                docPdf.setFontSize(12).setTextColor(0).setFont('helvetica', 'bold').text('Client :', 15, 55);
                docPdf.setFont('helvetica', 'normal').text(d.name || 'N/A', 40, 55);
                docPdf.setFont('helvetica', 'bold').text('Objet :', 15, 65);
                docPdf.setFont('helvetica', 'normal').text(docPdf.splitTextToSize(d.item || 'N/A', 150), 40, 65);
                let y = 85;
                docPdf.setFont('helvetica', 'bold').text('Notes :', 15, y); y += 8;
                const notes = docPdf.splitTextToSize(d.comments || 'Aucune note.', 180);
                docPdf.setFont('helvetica', 'normal').text(notes, 15, y);
                y += (notes.length * 5) + 15;
                if (d.photo) { try { docPdf.addImage(d.photo, 'JPEG', 15, y, 100, 75); y += 85; } catch(e) {} }
                if (d.signature) { try { docPdf.setFont('helvetica', 'bold').text("Signature Client :", 15, y); y += 5; docPdf.addImage(d.signature, 'PNG', 15, y, 50, 25); } catch(e) {} }
            }
            docPdf.save(`TechPrecision_Archives.pdf`);
            btn.textContent = 'PDF Global';
        });
    </script>
</body>
</html>
